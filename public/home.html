<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GAME TIER</title>

    <link rel="stylesheet" href="home.css">
</head>

<body>

    <header>
        <h1 class="logo">
            GAME<span>TIER</span>
        </h1>

        <nav>
            <a href="#" class="active">홈</a>
            <a href="#">게임</a>
            <a href="#">티어 인증</a>
            <a href="#">랭킹</a>
            <a href="#">커뮤니티</a>
        </nav>

        <button>로그인</button>
    </header>

    <main>

        <section class="hero">

            <div class="hero-text">
        
                <p class="hero-small">
                    게임으로 더 가까워지는 커뮤니티
                </p>
        
                <h2>
                    당신의 게임 실력,<br>
                    이제 <span>인증하세요.</span>
                </h2>
        
                <p class="hero-description">
                    좋아하는 게임의 티어를 인증하고<br>
                    다른 유저들과 함께 게임을 즐겨보세요.
                </p>
        
                <div class="hero-buttons">
        
                    <button class="start-btn">
                        ⚡ 지금 시작하기
                    </button>
        
                    <button class="info-btn">
                        서비스 소개
                    </button>
        
                </div>
        
            </div>
        
        
            <div class="hero-visual">
        
                <div class="glow"></div>
        
                <div class="game-circle">
                    🎮
                </div>
        
                <div class="floating-card card-one">
                    🏆 TIER
                </div>
        
                <div class="floating-card card-two">
                    ⚡ GAME
                </div>
        
            </div>
        
        </section>

        <section class="features">

            <div class="feature-card">
                <div class="feature-icon">🛡️</div>
        
                <div>
                    <h3>간편한 인증</h3>
                    <p>게임 계정 정보를 통해<br>쉽고 빠르게 인증하세요.</p>
                </div>
            </div>
        
        
            <div class="feature-card">
                <div class="feature-icon">📊</div>
        
                <div>
                    <h3>정확한 게임 정보</h3>
                    <p>게임 API를 기반으로<br>티어 정보를 확인합니다.</p>
                </div>
            </div>
        
        
            <div class="feature-card">
                <div class="feature-icon">👥</div>
        
                <div>
                    <h3>함께하는 커뮤니티</h3>
                    <p>게임을 좋아하는 사람들과<br>함께 소통해보세요.</p>
                </div>
            </div>
        
        </section>
    
    </main>

</body>
</html>
